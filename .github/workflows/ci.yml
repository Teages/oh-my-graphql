name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g corepack@latest && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm build
      # smoke check: the bundle loads and no dev-only test/deps leaked into dist
      - run: node -e "import('./dist/index.mjs').then((m) => { if (!m.createClient) { throw new Error('createClient export missing') } })"
      - run: "! grep -rEl 'graphql-yoga|@pothos|gazania' dist"
      - run: pnpm test:unit
      - uses: codecov/codecov-action@v7
